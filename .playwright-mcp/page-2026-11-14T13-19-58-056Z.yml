          - generic [ref=f12e968]:
            - generic [ref=f12e969]: CLINICAL CAPABILITY
            - heading "What Can GoClear Fix?" [level=3] [ref=f12e970]
            - paragraph [ref=f12e971]: GoClear effectively treats a wide range of dental alignment and malocclusion issues.
          - generic [ref=f12e972]:
            - generic [ref=f12e973]:
              - generic [ref=f12e974]:
                - generic [ref=f12e975]:
                  - generic [ref=f12e976]: ALIGNMENT
                  - generic [ref=f12e977]: Gentle Expansion
                - heading "Crowded Teeth" [level=4] [ref=f12e978]
                - paragraph [ref=f12e979]: Crowded teeth occur when there isn't enough space in the jaw for all teeth to fit normally. GoClear aligners gently shift teeth into their correct positions over time, giving you a straighter, healthier smile without metal brackets or wires.
              - link "Check Suitability" [ref=f12e981] [cursor=pointer]:
                - /url: /booking?case=Crowded%20Teeth
            - generic [ref=f12e985]:
              - generic [ref=f12e986]:
                - generic [ref=f12e987]:
                  - generic [ref=f12e988]: SPACING
                  - generic [ref=f12e989]: Gap Closure
                - heading "Gapped Teeth" [level=4] [ref=f12e990]
                - paragraph [ref=f12e991]: Spaces between teeth due to missing teeth, tongue thrusting, or teeth that do not fill the mouth properly. GoClear gradually brings separated teeth into uniform contact.
              - link "Check Suitability" [ref=f12e993] [cursor=pointer]:
                - /url: /booking?case=Gapped%20Teeth
            - generic [ref=f12e997]:
              - generic [ref=f12e998]:
                - generic [ref=f12e999]:
                  - generic [ref=f12e1000]: AESTHETICS
                  - generic [ref=f12e1001]: Balanced Arch
                - heading "Spacing & Gaps" [level=4] [ref=f12e1002]
                - paragraph [ref=f12e1003]: Gaps between teeth (diastema) can affect your smile's aesthetics and make it harder to chew properly. GoClear's precision-engineered aligners close these spaces gradually and comfortably, restoring a full, even smile.
              - link "Check Suitability" [ref=f12e1005] [cursor=pointer]:
                - /url: /booking?case=Spacing%20%26%20Gaps
            - generic [ref=f12e1009]:
              - generic [ref=f12e1010]:
                - generic [ref=f12e1011]:
                  - generic [ref=f12e1012]: BITE CORRECTION
                  - generic [ref=f12e1013]: Vertical Balance
                - heading "Overbite" [level=4] [ref=f12e1014]
                - paragraph [ref=f12e1015]: An overbite is when the upper front teeth excessively overlap the lower front teeth. Left untreated, it can cause wear on tooth enamel and jaw pain. GoClear aligners are designed to correct mild to moderate overbites effectively.
              - link "Check Suitability" [ref=f12e1017] [cursor=pointer]:
                - /url: /booking?case=Overbite
            - generic [ref=f12e1021]:
              - generic [ref=f12e1022]:
                - generic [ref=f12e1023]:
                  - generic [ref=f12e1024]: BITE CORRECTION
                  - generic [ref=f12e1025]: Jaw Alignment
                - heading "Underbite" [level=4] [ref=f12e1026]
                - paragraph [ref=f12e1027]: An underbite occurs when the lower teeth protrude further than the upper teeth. This can cause chewing difficulty and jaw discomfort. GoClear treatment plans target underbites to restore proper bite alignment.
              - link "Check Suitability" [ref=f12e1029] [cursor=pointer]:
                - /url: /booking?case=Underbite
            - generic [ref=f12e1033]:
              - generic [ref=f12e1034]:
                - generic [ref=f12e1035]:
                  - generic [ref=f12e1036]: OCCLUSION
                  - generic [ref=f12e1037]: Arch Correction
                - heading "Crossbite" [level=4] [ref=f12e1038]
                - paragraph [ref=f12e1039]: A crossbite happens when one or more upper teeth bite inside the lower teeth. It can lead to uneven tooth wear, gum disease, and bone loss. GoClear aligners move teeth into their correct alignment to fix crossbites efficiently.
              - link "Check Suitability" [ref=f12e1041] [cursor=pointer]:
                - /url: /booking?case=Crossbite
            - generic [ref=f12e1045]:
              - generic [ref=f12e1046]:
                - generic [ref=f12e1047]:
                  - generic [ref=f12e1048]: VERTICAL BITE
                  - generic [ref=f12e1049]: Contact Restoration
                - heading "Open Bite" [level=4] [ref=f12e1050]
                - paragraph [ref=f12e1051]: An open bite means the upper and lower teeth don't touch when the mouth is closed, often making it difficult to bite into food. GoClear can correct open bites caused by habits like thumb-sucking or tongue thrusting.
              - link "Check Suitability" [ref=f12e1053] [cursor=pointer]:
                - /url: /booking?case=Open%20Bite
            - generic [ref=f12e1057]:
              - generic [ref=f12e1058]:
                - generic [ref=f12e1059]:
                  - generic [ref=f12e1060]: DEEP OVERBITE
                  - generic [ref=f12e1061]: Incisal Staging
                - heading "Deep Bite" [level=4] [ref=f12e1062]
                - paragraph [ref=f12e1063]: A deep bite (deep overbite) is a severe overbite where upper front teeth cover most of the lower front teeth. It can cause wear and damage to teeth over time. GoClear aligners help correct deep bites step by step.
              - link "Check Suitability" [ref=f12e1065] [cursor=pointer]:
                - /url: /booking?case=Deep%20Bite
            - generic [ref=f12e1069]:
              - generic [ref=f12e1070]:
                - generic [ref=f12e1071]:
                  - generic [ref=f12e1072]: SYMMETRY
                  - generic [ref=f12e1073]: Facial Symmetry
                - heading "Mid-line Shift" [level=4] [ref=f12e1074]
                - paragraph [ref=f12e1075]: A mid-line discrepancy occurs when the center of your upper and lower teeth don't align. This affects facial symmetry and smile aesthetics. GoClear's customised treatment plans address mid-line issues for a perfectly balanced smile.
              - link "Check Suitability" [ref=f12e1077] [cursor=pointer]:
                - /url: /booking?case=Mid-line%20Shift
